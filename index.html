<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Окно — Затон, 1947</title>
<style>
@font-face{font-family:'OldStd';src:url('/fonts/old_standard_tt/old_standard_tt_cyrillic_400_normal.woff2') format('woff2');font-weight:400}
@font-face{font-family:'OldStd';src:url('/fonts/old_standard_tt/old_standard_tt_cyrillic_700_normal.woff2') format('woff2');font-weight:700}
:root{--red:#e01818;--ink:#d8d2c4;--dim:#8d887c;--bg:rgba(8,9,11,.88)}
html,body{margin:0;background:#000;overflow:hidden;font-family:'OldStd',Georgia,serif;color:var(--ink);user-select:none}
canvas{display:block}
#hint{position:fixed;left:12px;top:10px;font:12px monospace;opacity:.45;pointer-events:none}
#clock{position:fixed;right:14px;top:10px;font:700 15px monospace;color:var(--red);letter-spacing:2px;opacity:.9;text-shadow:0 0 8px #400}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#d8d2c4;opacity:.55;pointer-events:none}
#prompt{position:fixed;left:50%;top:58%;transform:translateX(-50%);font-size:18px;text-shadow:0 0 6px #000;pointer-events:none;display:none;text-align:center}
#prompt b{border:1px solid var(--ink);padding:0 6px;margin-right:8px;border-radius:3px}
#sub{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);max-width:70%;text-align:center;font-size:20px;text-shadow:0 0 8px #000,0 0 3px #000;pointer-events:none;display:none}
#sub .n{color:var(--dim);font-size:14px;display:block}
#thread{position:fixed;right:14px;bottom:14px;max-width:34%;text-align:right;font-size:15px;color:var(--red);text-shadow:0 0 6px #000;opacity:0;transition:opacity .6s;pointer-events:none}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);font-size:17px;text-shadow:0 0 6px #000;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;max-width:60%}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#red{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 40px #a00;opacity:0}
#dlg{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);width:min(760px,90%);background:var(--bg);border:1px solid #3a3730;padding:14px 20px;font-size:19px;line-height:1.35;display:none;cursor:pointer}
#dlg .who{color:var(--dim);font-size:14px;margin-bottom:4px;letter-spacing:1px}
#dlg .act{color:var(--dim);font-style:italic}
#dlg .more{text-align:right;color:var(--dim);font-size:13px;margin-top:6px}
#dlg .opt{padding:5px 8px;border-radius:3px}#dlg .opt:hover,#dlg .opt.sel{background:#26221c;outline:1px solid #5a4a30}
#dlg .opt b{color:var(--dim);margin-right:4px}
#dlg .sysrow{margin-top:10px;padding-top:6px;border-top:1px solid #2a2824;display:flex;gap:18px;justify-content:flex-end}
#dlg .sys{font-size:13px;color:#7d786c;cursor:pointer}#dlg .sys:hover{color:#bdb6a4}
kbd{font:11px monospace;border:1px solid #4a463c;border-radius:3px;padding:0 4px;color:#9a9484;margin-left:4px}
#dlg .more{font-size:12px}.glyph{color:var(--red);font-size:15px}
#stv{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center}
#stv .panel{width:min(920px,94%);height:min(560px,88%);background:#0c0d0f;border:1px solid #4a3a2a;box-shadow:0 0 40px #000;display:flex;flex-direction:column}
#stv .tabs{display:flex;border-bottom:1px solid #2a2824}
#stv .tab{padding:10px 16px;cursor:pointer;color:var(--dim);font-size:15px}
#stv .tab.on{color:var(--red);border-bottom:2px solid var(--red)}
#stv .body{flex:1;overflow:auto;padding:16px 20px;font-size:16px;line-height:1.4}
#stv .tl{position:relative;height:84px;margin:10px 0 4px}
#stv .tl .bar{position:absolute;left:0;right:0;top:36px;height:6px;background:#2a2824}
#stv .tl .now{position:absolute;top:26px;width:2px;height:26px;background:#d8d2c4}
#stv .tl .sel{position:absolute;top:22px;width:3px;height:34px;background:var(--red);box-shadow:0 0 8px var(--red)}
#stv .tl .mk{position:absolute;top:50px;width:6px;height:6px;background:#c8b27a;border-radius:50%;transform:translateX(-3px)}
#stv .tl .mk.big{background:var(--red)}
#stv .tl .lbl{position:absolute;top:60px;font-size:12px;color:var(--dim);transform:translateX(-50%)}
#stv input[type=range]{width:100%;accent-color:#e01818}
#stv button{background:#1a1612;color:var(--ink);border:1px solid #6a4a2a;padding:8px 18px;font:inherit;cursor:pointer;margin-right:8px}
#stv button.go{border-color:var(--red);color:var(--red)}
#stv .ev{padding:3px 0;cursor:pointer}#stv .ev:hover{color:#fff}.dim{color:var(--dim)}.red{color:var(--red)}
#stv .person{display:flex;gap:12px;margin:10px 0;padding:8px;border:1px solid #23211d}
#stv .person.key{border-color:#5a1a1a}
#stv canvas.map{background:#07080a;border:1px solid #2a2824;width:100%;height:100%}
#sync{position:fixed;left:50%;top:6%;transform:translateX(-50%);color:var(--red);font:700 20px monospace;letter-spacing:3px;display:none;text-shadow:0 0 10px #600}
#end{position:fixed;inset:0;background:#000;color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;overflow:auto}
#end h1{font-size:44px;font-weight:400;letter-spacing:6px;margin:0 0 18px}#end p{max-width:640px;color:var(--dim)}#end ul{text-align:left;color:var(--ink)}
#ghost{position:fixed;inset:0;pointer-events:none;display:none;box-shadow:inset 0 0 120px #5a8aff55}
#mini{position:fixed;left:14px;bottom:70px;width:176px;height:176px;border-radius:50%;border:2px solid #3a3228;box-shadow:0 0 14px #000,inset 0 0 18px #000;opacity:.92;pointer-events:none;background:#07080a}
#pocket{position:fixed;left:14px;bottom:14px;min-width:176px;height:44px;box-sizing:border-box;border:1px solid #3a3228;background:rgba(8,9,11,.78);padding:6px 10px;font-size:14px;display:flex;align-items:center;gap:8px;pointer-events:none}
#pocket .ic{width:26px;height:26px;border:1px solid #5a4a30;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim)}
#pocket.has .ic{border-color:#c02a20;color:#ff5a48;box-shadow:0 0 10px #a01810}#pocket.has .nm{color:#ffb0a4}
#newp{position:fixed;right:14px;top:44px;width:260px;display:none;gap:10px;align-items:center;background:rgba(8,9,11,.86);border:1px solid #3a3228;border-left:3px solid #c02a20;padding:8px 10px;transition:opacity .5s;opacity:0}
#newp img{width:56px;height:56px;border:1px solid #444;filter:grayscale(1)}#newp .t{font-size:11px;letter-spacing:2px;color:#ff6a58;text-transform:uppercase}#newp .n{font-size:17px;margin-top:2px}#newp .s{font-size:12px;color:var(--dim);margin-top:2px}
#notes{position:fixed;right:14px;top:132px;width:300px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.note{background:rgba(8,9,11,.86);border:1px solid #3a3228;border-left:3px solid #8a6a3a;padding:6px 10px;font-size:14px;transition:opacity .3s}
#weapon{position:fixed;left:14px;bottom:62px;min-width:176px;height:34px;box-sizing:border-box;border:1px solid #3a3228;background:rgba(8,9,11,.78);padding:4px 10px;font-size:14px;display:none;align-items:center;gap:8px;pointer-events:none}
#mini{bottom:104px!important}
#wait{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:46px;color:#d8c9a0;text-shadow:0 0 12px #000;display:none;animation:spin 2s linear infinite;pointer-events:none}@keyframes spin{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(180deg)}}
#stv .tab kbd{margin-left:6px}
</style></head>
<body>
<canvas id="mini" width="176" height="176"></canvas><div id="pocket"><div class="ic">◌</div><div class="nm">Карман пуст</div></div><div id="newp"><img id="newp-img" alt=""><div><div class="t">Встречен новый человек</div><div class="n" id="newp-n"></div><div class="s" id="newp-s"></div></div></div>
<div id="notes"></div><div id="weapon"><div class="ic">⌐</div><div class="nm"></div><kbd>1</kbd></div><div id="wait">⧗</div><div id="hint"></div><div id="clock"></div><div id="cross"></div><div id="prompt"></div><div id="sub"></div><div id="thread"></div><div id="toast"></div>
<div id="sync"></div><div id="ghost"></div><div id="red"></div><div id="flash"></div><div id="fade"></div>
<div id="pause" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;font-size:28px;letter-spacing:4px;cursor:pointer;color:#d8d2c4">ПАУЗА — клик, чтобы продолжить</div>
<div id="loading" style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8d887c;font-size:22px;letter-spacing:5px;z-index:50"><div>ЗАТОН · 1947</div><div style="font-size:13px;letter-spacing:2px;margin-top:14px;opacity:.6">загрузка…</div></div>
<div id="dlg"></div><div id="stv"></div><div id="end"></div>
<script type="module" src="/src/main.ts"></script></body></html>
